@switch (forma()) {
  @case ('rayitos') {
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round">
      <path d="M12 34 4 30M17 22l-5-9M28 17l2-11" />
    </svg>
  }
  @case ('estrella-contorno') {
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round">
      <path d="m24 5 5.6 11.4 12.6 1.8-9.1 8.9 2.1 12.5L24 33.7l-11.2 5.9 2.1-12.5-9.1-8.9 12.6-1.8Z" />
    </svg>
  }
  @case ('corazon-contorno') {
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round">
      <path d="M24 40S9 30.8 9 20a8.5 8.5 0 0 1 15-5.4A8.5 8.5 0 0 1 39 20c0 10.8-15 20-15 20Z" />
    </svg>
  }
  @case ('estrella-sonriente') {
    <!-- Sticker: estrella con borde blanco grueso, carita y mejillas. -->
    <svg class="sticker" viewBox="0 0 48 48" stroke-linecap="round" stroke-linejoin="round">
      <path
        class="sticker-cuerpo"
        paint-order="stroke"
        stroke-width="5"
        d="m24 5 5.6 11.4 12.6 1.8-9.1 8.9 2.1 12.5L24 33.7l-11.2 5.9 2.1-12.5-9.1-8.9 12.6-1.8Z" />
      <path class="sticker-cara" fill="none" stroke-width="1.8" d="M18.5 22.5q2-2.4 4 0M25.5 22.5q2-2.4 4 0M20.5 26.8q3.5 3.4 7 0" />
      <circle class="sticker-mejilla" cx="17" cy="26.5" r="2" />
      <circle class="sticker-mejilla" cx="31" cy="26.5" r="2" />
    </svg>
  }
  @case ('subrayado') {
    <svg viewBox="0 0 200 24" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" preserveAspectRatio="none">
      <path class="trazo" pathLength="1" d="M5 17C55 7 125 4 195 11" />
    </svg>
  }
}
